plugins {
    id 'application'
}

group = 'br.unicamp.mc322'
version = '4.0'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = 'Main'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

javadoc {
    title = 'LM Racing Compressor Wheels - Documentacao'
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.author = true
    options.addBooleanOption('Xdoclint:all,-missing', true) // ignora descrições ausentes em documentação no javadoc
}

// necessario para o Scanner ler o teclado
run {
    standardInput = System.in
}
