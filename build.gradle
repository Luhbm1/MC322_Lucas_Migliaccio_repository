plugins {
    id 'java'
    id 'application'
}

group = 'br.unicamp.ic.mc322'
version = '4.0'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17 // para adaptar-se ao uso de outras versões de JDK que não a 17 (no meu caso o JDK 26)
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = 'br.unicamp.ic.mc322.Main'
}

tasks.withType(JavaCompile).configureEach { // tratamento de acentos nos comentarios
    options.encoding = 'UTF-8'
}

javadoc { // organização da documentação javadoc
    title = 'LM Racing Compressor Wheels - Documentacao'
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.author = true
    options.addBooleanOption('Xdoclint:all,-missing', true) // ignora descrições ausentes em documentação no javadoc
}

tasks.withType(Javadoc).configureEach { // tratamento de caracteres especias para o javadoc
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
}

// necessario para o Scanner ler o teclado
run {
    standardInput = System.in
}

// implementação de testes JUnit
dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging { events 'passed', 'skipped', 'failed'}
    testLogging { exceptionFormat = 'full' }
}

